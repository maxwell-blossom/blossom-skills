[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@resvg/resvg-js"]

[build]
  command = "bash build.sh"
  publish = "dist"

# One deploy per web-app environment: main is PROD, the develop branch deploy is DEV
# (develop--blossom-skills.netlify.app, proxied by dev. and staging.blossomsocial.com/skills). See config.py.
# These only reach the build. Functions read BLOSSOM_ENV from the Netlify UI variable (Branch deploys = DEV), so keep both in step.
[context.production.environment]
  BLOSSOM_ENV = "PROD"

[context.develop.environment]
  BLOSSOM_ENV = "DEV"
